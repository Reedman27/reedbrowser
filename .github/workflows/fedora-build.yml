name: Fedora 45 build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: dnf -y install gcc-c++ cmake make pkgconf-pkg-config gtk4-devel webkitgtk6.0-devel sqlite-devel json-glib-devel libarchive-devel libcurl-devel python3
      - name: Validate source bundle
        run: python3 tools/validate-release.py
      - name: Build
        run: JOBS=2 ./build.sh
